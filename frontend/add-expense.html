```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Expense | Expense Tracker</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/add-expense.css">
</head>

<body>
    <div class="app-layout">

        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-brand">
                <div class="brand-icon">E</div>
                <span>Expense Tracker</span>
            </div>

            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-link">
                    <span class="nav-icon">▦</span>
                    <span>Dashboard</span>
                </a>

                <a href="expenses.html" class="nav-link">
                    <span class="nav-icon">☷</span>
                    <span>Expense History</span>
                </a>

                <a href="add-expense.html" class="nav-link active">
                    <span class="nav-icon">＋</span>
                    <span>Add Expense</span>
                </a>
            </nav>

            <div class="sidebar-bottom">
                <button type="button" class="logout-button" id="logout-button">
                    <span class="nav-icon">↪</span>
                    <span>Logout</span>
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">

            <header class="page-header">
                <div>
                    <p class="page-eyebrow">EXPENSE MANAGEMENT</p>
                    <h1>Add New Expense</h1>
                    <p class="page-subtitle">
                        Record a new expense and keep track of your spending.
                    </p>
                </div>

                <a href="expenses.html" class="back-link">
                    ← Back to Expenses
                </a>
            </header>

            <!-- Error and success messages -->
            <div
                id="form-error"
                class="form-message error-message"
                role="alert"
                hidden
            ></div>

            <div
                id="form-success"
                class="form-message success-message"
                role="status"
                hidden
            ></div>

            <!-- Expense Form -->
            <section class="expense-form-card">

                <div class="form-card-heading">
                    <div class="form-heading-icon">＋</div>

                    <div>
                        <h2>Expense Details</h2>
                        <p>Enter the details of the expense below.</p>
                    </div>
                </div>

                <form id="expense-form">

                    <div class="form-group">
                        <label for="description">
                            Description
                        </label>

                        <input
                            type="text"
                            id="description"
                            name="description"
                            placeholder="e.g. Groceries, transport fare"
                            maxlength="200"
                            required
                        >
                    </div>

                    <div class="form-row">

                        <div class="form-group">
                            <label for="amount">
                                Amount (₦)
                            </label>

                            <input
                                type="number"
                                id="amount"
                                name="amount"
                                placeholder="e.g. 5000"
                                min="0.01"
                                step="0.01"
                                required
                            >
                        </div>

                        <div class="form-group">
                            <label for="category">
                                Category
                            </label>

                            <select
                                id="category"
                                name="category"
                                required
                            >
                                <option value="">Select a category</option>
                                <option value="Food">Food</option>
                                <option value="Transport">Transport</option>
                                <option value="Bills">Bills</option>
                                <option value="Shopping">Shopping</option>
                                <option value="Entertainment">Entertainment</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>

                    </div>

                    <div class="form-group">
                        <label for="expense-date">
                            Expense Date
                        </label>

                        <input
                            type="date"
                            id="expense-date"
                            name="expenseDate"
                            required
                        >
                    </div>

                    <div class="form-actions">
                        <a href="expenses.html" class="cancel-button">
                            Cancel
                        </a>

                        <button
                            type="submit"
                            class="submit-button"
                            id="submit-button"
                        >
                            Save Expense
                        </button>
                    </div>

                </form>
            </section>

        </main>
    </div>

    <!-- JavaScript files -->
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script src="js/add-expense.js"></script>

</body>
</html>
```
